# splat config for SLPS_015.56 (retail, sha1 below). Section bounds checked on our exe:
# text 0x800118dc..0x80066828 (last jr ra), gp set at 0x80011a1c to 0x8008a808 (= start of .sdata),
# startup clears bss 0x8008ac20..0x80090c68.
# Text units: psyq/<addr> are Sony library blocks found by tools/psyq/match.py (asm, never decompiled);
# game/<name> are the original source files rebuilt from the evidence in docs/layout.md.
name: LSD Dream Emulator (SLPS-01556)
sha1: 76322eeade5ebb22dca57fdeac7d68c30f06308d
options:
  basename: lsd
  platform: psx
  compiler: GCC
  base_path: ..
  target_path: extract/SLPS_015.56
  asm_path: asm
  asset_path: assets
  src_path: src
  build_path: build
  ld_script_path: linker/lsd.ld
  symbol_addrs_path:
    - config/symbol_addrs.txt
    - config/symbol_addrs.psyq.txt
  undefined_funcs_auto_path: linker/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.txt

  gp_value: 0x8008A808
  ld_gp_expression: main_SDATA_START
  find_file_boundaries: True
  migrate_rodata_to_functions: True
  disassemble_all: True
  use_legacy_include_asm: False
  include_asm_macro_style: maspsx_hack
  o_as_suffix: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]
  subalign: 4
  ld_bss_is_noload: True
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    bss_size: 0x6048
    subsegments:
      # .rodata per translation unit. Game units use the dot form so
      # splat pairs them with their c unit: jtbls migrate into their function, every other game rodata
      # symbol has force_not_migration and is included in source order with INCLUDE_RODATA. Sony units
      # keep plain rodata files.
      - [0x800,  rodata, psyq/80012768]   # LIBGS/LIBGTE print_matrix, prnt, _make_packet, EigenMatrix
      - [0xA8C, .rodata, game/heap]  # Heap_Create "bMemPMgr"
      - [0xABC,  rodata, psyq/8001EF70]   # GsLinkObject4
      - [0xB54, .rodata, game/model_object]  # jtbl ModelObject_NextPrim
      - [0xBD4,  rodata, psyq/80020C74]   # sys.c $Id, LIBGPU, LIBETC intr.c
      - [0xF64, .rodata, game/pad]  # const table Pad_InitButtons
      - [0xFA4, .rodata, game/scene]
      - [0xFD8, .rodata, game/file_cd]  # strings of File_ResolveEntries, File_Locate, then jtbls of File_ServiceQueue
      - [0x1040, rodata, psyq/80028B78]   # LIBCD
      - [0x14D8, rodata, psyq/80032588]   # LIBSND SsSetTickMode jtbl (game/seq_timer until 2026-10-17)
      - [0x14F0, rodata, psyq/8003410C]   # LIBSND SEQREAD jtbls (moved to psyq 2026-10-15)
      - [0x1764, rodata, psyq/80036AC8]   # LIBSPU
      - [0x17EC, .rodata, game/bgm]
      - [0x1818, rodata, psyq/8003A670]   # LIBSND SEQINIT messages
      - [0x1878, rodata, psyq/8003B21C]
      - [0x1890, .rodata, game/menu_screen]
      - [0x1908, rodata, psyq/8003F2AC]
      - [0x19B4, rodata, psyq/8004117C]   # sprintf
      - [0x1A90, .rodata, game/screen_sprite]
      - [0x1AA4, rodata, psyq/80045E54]   # MDEC
      - [0x1B6C, rodata, psyq/80047910]   # "DMA STATUS ERROR"
      - [0x1B84, .rodata, game/path_table]  # SND\ table strings (from data 0x800819B8..) then ETC\ASMK.STR
      - [0x1BEC, .rodata, game/dream_runner]  # object A: DreamRunner_Init strings, jtbl DreamRunner_OnStageMessage
      - [0x1C34, .rodata, game/menu]  # object B: FLASHBACK block (data 0x80086CFC), Menu_Init..Menu_GetVtbl
      - [0x1D0C, .rodata, game/card]  # object B, card part: the strings of g_cardMessageNames
      - [0x1DD0, .rodata, game/comment_object]  # object C: alphabet, COMINPUT/FONTICON, jtbl CommentObject_OnKey
      - [0x1EA4, .rodata, game/string_list]  # object D: alphabet copy, StringList_Open, jtbl StringList_OnKey
      - [0x1F4C, .rodata, game/place]  # object D, place part: jtbl Place_OnDreamSysNotify
      - [0x1F6C, .rodata, game/graph]  # objects D2 and E start: ETC\ETCSE of Graph_Init, ETC\HGRAPH.TIM
      - [0x1F88, .rodata, game/dream_sys]  # object E: jtbls DreamSys_OnPad, DreamSys_OnEntityEvent
      - [0x206C, .rodata, game/sym]  # object F: Sym_LoadModels, jtbl Sym_CheckRule
      - [0x20DC, c, game/main]  # proven
      - [0x2194, asm, psyq/80011994]  # 2MBYTE,LIBAPI,MALLOC
      - [0x2864, c, game/scene_draw]  # proven
