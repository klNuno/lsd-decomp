# splat config for SLPS_015.56 (retail, sha1 below). Section bounds checked on our exe:
# text 0x800118dc..0x80066828 (last jr ra), gp set at 0x80011a1c to 0x8008a808 (= start of .sdata),
# startup clears bss 0x8008ac20..0x80090c68.
# Text units: psyq/<addr> are Sony library blocks found by tools/psyq/match.py (asm, never decompiled);
# game/<addr> are the code between them, to be split into real translation units as evidence comes.
name: LSD Dream Emulator (SLPS-01556)
sha1: 76322eeade5ebb22dca57fdeac7d68c30f06308d
options:
  basename: lsd
  platform: psx
  compiler: GCC
  base_path: ..
  target_path: extract/SLPS_015.56
  asm_path: asm
  asset_path: assets
  src_path: src
  build_path: build
  ld_script_path: linker/lsd.ld
  symbol_addrs_path:
    - config/symbol_addrs.txt
    - config/symbol_addrs.psyq.txt
  undefined_funcs_auto_path: linker/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.txt

  gp_value: 0x8008A808
  find_file_boundaries: True
  migrate_rodata_to_functions: True
  disassemble_all: True
  use_legacy_include_asm: False
  include_asm_macro_style: maspsx_hack
  o_as_suffix: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]
  subalign: 4
  ld_bss_is_noload: True
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    bss_size: 0x6048
    subsegments:
      # .rodata per translation unit (.agents/research/rodata-split.md). Game units use the dot form so
      # splat pairs them with their c unit: jtbls migrate into their function, every other game rodata
      # symbol has force_not_migration and is included in source order with INCLUDE_RODATA. Sony units
      # keep plain rodata files.
      - [0x800,  rodata, psyq/80012768]   # LIBGS/LIBGTE print_matrix, prnt, _make_packet, EigenMatrix
      - [0xA8C,  .rodata, game/80017A20]  # func_80017A20 "bMemPMgr"
      - [0xABC,  rodata, psyq/8001EF70]   # GsLinkObject4
      - [0xB54,  .rodata, game/8001F250]  # jtbl func_80020050
      - [0xBD4,  rodata, psyq/80020C74]   # sys.c $Id, LIBGPU, LIBETC intr.c
      - [0xF64,  .rodata, game/80025B34]  # const table func_80025E1C
      - [0xFA4,  .rodata, game/80025F7C]
      - [0xFD8,  .rodata, game/800271D8]  # strings of func_80027FFC, func_80028920, then jtbls of func_80027A24
      - [0x1040, rodata, psyq/80028B78]   # LIBCD
      - [0x14D8, .rodata, game/80032588]
      - [0x14F0, rodata, psyq/8003410C]   # LIBSND SEQREAD jtbls (moved to psyq 2026-10-15, sony-suspects.md)
      - [0x1764, rodata, psyq/80036AC8]   # LIBSPU
      - [0x17EC, .rodata, game/800398E0]
      - [0x1818, rodata, psyq/8003A670]   # LIBSND SEQINIT messages
      - [0x1878, rodata, psyq/8003B21C]
      - [0x1890, .rodata, game/8003B854]
      - [0x1908, rodata, psyq/8003F2AC]
      - [0x19B4, rodata, psyq/8004117C]   # sprintf
      - [0x1A90, .rodata, game/80041AB4]
      - [0x1AA4, rodata, psyq/80045E54]   # MDEC
      - [0x1B6C, rodata, psyq/80047910]   # "DMA STATUS ERROR"
      - [0x1B84, .rodata, game/80048894]  # SND\ table strings (from data 0x800819B8..) then ETC\ASMK.STR
      - [0x1BEC, .rodata, game/800494B4]  # object A: func_80049684 strings, jtbl func_80049EB4
      - [0x1C34, .rodata, game/8004D578]  # object B: FLASHBACK block (data 0x80086CFC), func_8004D578..func_80050034
      - [0x1DD0, .rodata, game/80050BA8]  # object C: alphabet, COMINPUT/FONTICON, jtbl func_800513D0
      - [0x1EA4, .rodata, game/80051F24]  # object D: alphabet copy, func_80051F24, jtbls func_800522DC, func_80053984
      - [0x1F6C, .rodata, game/80057FC8]  # object D2: ETC\ETCSE of func_80057FC8
      - [0x1F78, .rodata, game/80058078]  # object E: func_80058078, jtbls func_80058C58, func_8005B03C
      - [0x206C, .rodata, game/8005C508]  # object F: func_8005C508, jtbl func_8005CBC8
      - [0x20DC, c, game/800118DC]
