      - [0x166AC, asm, psyq/80025EAC]  # LIBAPI,LIBETC
      - [0x1677C, c, game/80025F7C]
      - [0x17930, asm, psyq/80027130]  # LIBC2
      - [0x179D8, c, game/800271D8]  # one TU to 0x80028B78: its strings precede its jtbls in .rodata; 0x80027D40 is game code (tools/psyq/match.py FALSE_HITS)
      - [0x19378, asm, psyq/80028B78]  # LIBC2,LIBCD
