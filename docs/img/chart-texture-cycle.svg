<text x="319.75" y="282" class="t2" font-size="11" text-anchor="middle" font-weight="normal">days 11 to 20</text>
<text x="319.75" y="170" class="t2" font-size="12" text-anchor="middle" font-weight="600">A B</text>
<text x="486.25" y="282" class="t2" font-size="11" text-anchor="middle" font-weight="normal">days 21 to 30</text>
<text x="486.25" y="127" class="t2" font-size="12" text-anchor="middle" font-weight="600">A B C</text>
<text x="652.75" y="282" class="t2" font-size="11" text-anchor="middle" font-weight="normal">days 31 to 40</text>
<text x="652.75" y="84" class="t2" font-size="12" text-anchor="middle" font-weight="600">A B C D</text>
<text x="403" y="302" class="t3" font-size="12" text-anchor="middle" font-weight="normal">Day of the 40-day cycle (day 41 starts the next one)</text>
<text x="24" y="325" class="t3" font-size="12" text-anchor="start" font-weight="normal">Each set allowed on a day is equally likely: 1 in 2 on days 11 to 20, 1 in 4 on days 31 to 40.</text>
<text x="24" y="342" class="t3" font-size="12" text-anchor="start" font-weight="normal">The cycle restarts at day 41, 81 and so on; days 361 to 365 count as days 1 to 5 and always load A.</text>
</svg>
