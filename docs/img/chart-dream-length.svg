<text x="403" y="344" class="t3" font-size="12" text-anchor="middle" font-weight="normal">Starting stage (index in the game&#x27;s table)</text>
<text x="24" y="365" class="t3" font-size="12" text-anchor="start" font-weight="normal">Stage 0, where day 1 starts, gives 4 minutes; stage 5 gives the longest dream (10), stage 6 the shortest (1).</text>
<text x="24" y="382" class="t3" font-size="12" text-anchor="start" font-weight="normal">Nominal time: the limit is stored as seconds x 15 ticks; in the emulator a tick was one game frame.</text>
